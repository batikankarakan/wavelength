# Run Wavelength without Windows:   docker compose up --build   ->   http://localhost:5281
# (works with Docker Desktop and OrbStack on macOS, and on Linux). The first start creates the database
# with the 19 tables and the demo data, which takes ~20 seconds.
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Wavelength!2026"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Wavelength!2026' -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - wavelength-sql:/var/opt/mssql

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      WAVELENGTH_DB: "Data Source=sql,1433;Initial Catalog=Wavelength;User Id=sa;Password=Wavelength!2026;MultipleActiveResultSets=True"
    ports:
      - "5281:8080"
    volumes:
      - wavelength-uploads:/app/uploads
    depends_on:
      sql:
        condition: service_healthy

volumes:
  wavelength-sql:
  wavelength-uploads:
